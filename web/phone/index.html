<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Phone Sensor</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-alert="other" data-stage="setup">
    <main>
      <section id="setup">
        <h1>Phone sensor</h1>
        <p class="hint">Pick this phone's role. Use A on one iPhone and B on the other.</p>
        <div class="roles" role="radiogroup" aria-label="Phone role">
          <button class="role" data-role="A" role="radio" aria-checked="true">A</button>
          <button class="role" data-role="B" role="radio" aria-checked="false">B</button>
        </div>
        <button id="start" class="primary">Start sensors</button>
        <p class="hint small">This page needs motion sensors, the microphone and location. Keep it open, in the foreground, and don't cover the speaker or mic.</p>
        <p id="setup-error" class="error" hidden></p>
      </section>

      <section id="running">
        <div id="badge" aria-live="polite">
          <span id="badge-role">A</span>
          <span id="badge-alert">CLEAR</span>
        </div>
        <dl id="status">
          <div><dt>Server</dt><dd id="s-conn">—</dd></div>
          <div><dt>Audio</dt><dd id="s-audio">—</dd></div>
          <div><dt>Motion</dt><dd id="s-motion">—</dd></div>
          <div><dt>GPS</dt><dd id="s-gps">—</dd></div>
          <div><dt>Last chirp</dt><dd id="s-chirp">—</dd></div>
        </dl>
        <p id="run-warning" class="error" hidden></p>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proximity Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="topbar">
      <div id="hud-primary" aria-label="Primary telemetry"></div>
      <nav id="tabs" role="tablist" aria-label="Views"></nav>
      <label id="mock-speed" title="How fast the mock data plays (mock boards and airspace simulator)" hidden>
        <span class="k">Mock speed</span>
        <input type="range" min="0" max="9" step="1" value="5" aria-label="Mock data speed" />
        <output>1×</output>
      </label>
      <div id="ui-size" role="group" aria-label="Interface size">
        <button class="btn" data-ui="smaller" aria-label="Smaller interface" title="Smaller interface">−</button>
        <button class="btn" data-ui="reset" aria-label="Reset interface size" title="Reset interface size">90%</button>
        <button class="btn" data-ui="larger" aria-label="Larger interface" title="Larger interface">+</button>
      </div>
      <div id="conn" class="pill" data-status="connecting">connecting</div>
    </header>
    <main id="cockpit" class="tab-panel" role="tabpanel" hidden>
      <section class="display" aria-label="A POV">
        <div class="tcas-mount" data-mount></div>
      </section>
      <section class="display" aria-label="B POV">
        <div class="tcas-mount" data-mount></div>
      </section>
    </main>
    <main id="scene3d" class="tab-panel" role="tabpanel" hidden>
      <div class="tcas-mount" data-mount></div>
    </main>
    <details id="hud-drawer" open>
      <summary>Diagnostics</summary>
      <div id="diagnostics"></div>
    </details>
    <script type="module" src="./main.js"></script>
  </body>
</html>

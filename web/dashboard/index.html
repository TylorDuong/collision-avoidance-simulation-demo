<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proximity Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="topbar">
      <div id="hud-primary" aria-label="Primary telemetry"></div>
      <div id="conn" class="pill" data-status="connecting">connecting</div>
    </header>
    <main id="cockpit">
      <section class="display" aria-label="A POV">
        <div id="tcas-mount-a" class="tcas-mount"></div>
      </section>
      <section class="display" aria-label="B POV">
        <div id="tcas-mount-b" class="tcas-mount"></div>
      </section>
    </main>
    <details id="hud-drawer" open>
      <summary>Diagnostics</summary>
      <div id="diagnostics"></div>
    </details>
    <script type="module" src="./main.js"></script>
  </body>
</html>
